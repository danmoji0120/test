<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Doll Squad synthetic render benchmark</title>
    <style>
      body {
        margin: 0;
        background: #10131e;
      }
      canvas {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module">
      import { launch, tickProjectiles } from "/src/game/projectiles.ts";
      import { updateVision } from "/src/game/visibility.ts";
      import { Renderer } from "/src/client/render.ts";
      import { AudioEngine } from "/src/client/audio.ts";
      import {
        createWorld,
        makePlayer,
        spawnEnemy,
        event,
      } from "/src/game/simulation.ts";
      const players = Array.from({ length: 4 }, (_, i) => {
        const p = makePlayer("p" + i, "BENCH " + i);
        p.character = i % 2 ? "luna" : "aria";
        return p;
      });
      const representative = new URLSearchParams(location.search).has(
        "representative",
      );
      const w = createWorld("render-benchmark", 42, players, 10);
      w.alertState.level = 4;
      w.enemies = [];
      // Explicit open stress fixture: all twenty enemies remain visible to exercise raster rendering.
      w.map.obstacles = [];
      players.forEach((p, i) => {
        p.x = 2500 + i * 55;
        p.y = 1650 + (i % 2) * 60;
        p.moving = true;
      });
      for (let y = 1350; y <= 1950 && w.enemies.length < 20; y += 110) {
        for (let x = 2050; x <= 2950 && w.enemies.length < 20; x += 110) {
          const index = w.enemies.length;
          const kind = representative
            ? index === 0
              ? "juggernaut"
              : index === 3 || index === 17
                ? "drone"
                : index === 6
                  ? "walker"
                  : index === 9
                    ? "artillery"
                    : ["rifle", "rush", "heavy"][index % 3]
            : [
                "rifle",
                "rush",
                "heavy",
                "juggernaut",
                "drone",
                "walker",
                "artillery",
              ][index % 7];
          spawnEnemy(w, { x, y }, kind);
        }
      }
      if (w.enemies.length !== 20)
        throw new Error("Benchmark requires exactly 20 enemies");
      const renderer = new Renderer(
        document.querySelector("canvas"),
        new AudioEngine(),
      );
      updateVision(w, true);
      renderer.set(w, "p0");
      const draw = renderer.draw.bind(renderer),
        drawCosts = [];
      renderer.draw = (...args) => {
        const start = performance.now();
        draw(...args);
        drawCosts.push(performance.now() - start);
        if (drawCosts.length > 600) drawCosts.shift();
      };
      renderer.start();
      let clock = 0;
      setInterval(() => {
        clock += 1 / 15;
        w.time = clock;
        for (const [i, p] of players.entries()) {
          p.angle = clock + i;
          p.x = 2500 + i * 55 + Math.sin(clock * 3 + i) * 20;
          p.recoil = 0.05;
          if (Math.floor(clock * 15) % 5 === 0)
            event(w, {
              type: "hit",
              actor: p.id,
              x: p.x + Math.cos(p.angle) * 300,
              y: p.y + Math.sin(p.angle) * 300,
            });
          if (Math.floor(clock * 15) % 2 === 0)
            event(w, {
              type: "shot",
              actor: p.id,
              weapon: i === 2 ? "sg" : "ar",
              x: p.x,
              y: p.y,
              toX: p.x + Math.cos(p.angle) * 480,
              toY: p.y + Math.sin(p.angle) * 480,
            });
        }
        for (const [i, e] of w.enemies.entries()) {
          e.angle = clock + i;
          e.windup = 0.5;
        }
        if (Math.floor(clock * 15) % 15 === 0) {
          for (const [i, e] of w.enemies
            .filter((e) => e.kind === "walker" || e.kind === "artillery")
            .entries())
            launch(
              w,
              e,
              players[i % 4],
              e.kind === "artillery" ? "mortar" : "cannon",
              "bench",
              true,
            );
          for (const q of w.projectiles) q.damage = 0;
        }
        tickProjectiles(w, 1 / 15);
        updateVision(w);
        renderer.set(w, "p0");
      }, 1000 / 15);
      window.benchmark = () => ({
        roster: w.enemies.reduce(
          (a, e) => ((a[e.kind] = (a[e.kind] || 0) + 1), a),
          {},
        ),
        frames: renderer.frames,
        drawCosts,
        players: players.length,
        enemies: w.enemies.length,
        particles: renderer.particles.length,
        trails: renderer.trails.length,
        positions: renderer.positions.size,
      });
      window.backgroundStress = () => {
        renderer.stop();
        for (let n = 0; n < 10000; n++) {
          event(w, { type: "hit", actor: "p0", x: 2550, y: 1650, damage: 34 });
          if (n % 100 === 99) renderer.set(w, "p0");
        }
        const result = {
          events: 10000,
          particles: renderer.particles.length,
          trails: renderer.trails.length,
        };
        renderer.start();
        return result;
      };
    </script>
  </body>
</html>
