<!doctype html><html lang="ko"><meta charset="utf-8"><title>V4 map QA — generated terrain, omniscient inspection fixture</title><style>body{margin:0;background:#101419;color:#e8cf9f;font:16px sans-serif}header{padding:14px}canvas{width:1280px;height:840px;display:block}</style><header>BARREN FRONTIER · Seed <span id="seed"></span> · 지형 QA 전체도 (전술 시야를 해제한 검사 화면)</header><canvas width="1280" height="840"></canvas><script type="module">
import {createWorld,makePlayer} from '/src/game/simulation.ts';import {paintTerrain} from '/src/client/terrain.ts';import{environmentImage}from'/src/art/environment.ts';
